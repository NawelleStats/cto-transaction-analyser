[project]
name = "cto-transaction-analyzer"
version = "0.1.0"
description = "Analyse d'exports CSV BoursoBank pour un compte-titres ordinaire"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "pydantic-settings>=2.0",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "streamlit>=1.32",
    "plotly>=5.20",
    "requests>=2.31",
]

[dependency-groups]
dev = ["pytest>=7.0"]